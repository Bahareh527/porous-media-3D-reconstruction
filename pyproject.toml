[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-media-reconstruction"
version = "1.1.0"
description = "Validated 3D digital-rock preparation, reconstruction, and evaluation workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bahareh Keshavarz"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-image>=0.22,<1"]

[project.optional-dependencies]
learning = ["tensorflow>=2.16,<2.21"]
netcdf = ["netCDF4>=1.6,<2"]
flow = ["openpnm>=3.4,<4", "porespy>=2.4,<3"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5.10", "nbclient>=0.10"]

[project.scripts]
porous-media = "porous_media.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_learning.py" = ["E402"]
"scripts/refresh_notebooks.py" = ["E501"]
