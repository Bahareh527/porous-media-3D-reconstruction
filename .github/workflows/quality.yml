name: Repository quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,netcdf]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest
      - run: python scripts/check_repository.py
      - run: python scripts/audit_notebooks.py
  learning:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[learning,dev,netcdf,notebook]"
      - run: python -m pytest
      - run: python scripts/execute_notebooks.py
